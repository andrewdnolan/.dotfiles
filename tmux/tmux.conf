#Remap prefix 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# See: https://tomlankhorst.nl/iterm-tmux-vim-true-color/
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless navigation and resize between tmux panes and neovim splits,
# plus cross-instance copy sync via tmux buffers.
# See: https://github.com/aserowy/tmux.nvim
set -g @plugin 'aserowy/tmux.nvim'

# C-hjkl pane navigation: forward to neovim when it is the active process,
# otherwise navigate the tmux pane directly.  These bindings must be explicit
# because the TPM plugin alone does not install them.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Solarized theme
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @colors-solarized 'dark'

# Terminal type configuration
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Source tmuxline snapshot if it exists.
# Generate/refresh with :TmuxlineSnapshot ~/.tmux/tmuxline.conf inside nvim.
if-shell "[ -f ~/.tmux/tmuxline.conf ]" "source ~/.tmux/tmuxline.conf"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
